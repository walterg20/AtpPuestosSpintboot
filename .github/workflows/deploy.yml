name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build artifact
        run: chmod +x mvnw && ./mvnw -B -pl atp-puestos-camineros -am package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atp-puestos-camineros
          path: atp-puestos-camineros/target/*.jar
          retention-days: 30

