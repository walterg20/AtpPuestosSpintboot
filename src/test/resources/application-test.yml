# Perfil de test (T-005): la aplicacion arranca SIN conexion a SQL Server.
# Usa H2 en memoria; ddl-auto=none => no se valida ni genera esquema,
# de modo que el contexto carga aunque no existan las tablas legacy.
#
# Este archivo vive en los recursos de TEST de cada modulo (no en `main`), asi que
# solo entra en el classpath cuando corren los tests. En runtime manda
# `application.yml` (que apunta a SQL Server real).
spring:
  datasource:
    url: jdbc:h2:mem:atppuestos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
