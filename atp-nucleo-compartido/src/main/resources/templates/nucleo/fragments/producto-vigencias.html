<!DOCTYPE html>
<!--
  Grilla del nivel 1 (PRODUCT1) de la pantalla de Productos — T-205, T-206.

  - 5 columnas con los rótulos verbatim del legacy (spec §3.2).
  - Título de sección `Level1` verbatim (SA-P02).
  - La columna ProdFchVig se marca como rótulo derivado: la KB no declara descripción para ese
    atributo (D-20, R-PROD-24).
  - Cada fila `i` emite name="vigencias[i].<campo>" e id="vigencias_i_<campo>" (T-206, SA-P10).
  - El <template id="plantilla-vigencia"> es la fila vacía que clona el JS (T-207).
  - Accesibilidad (R-PROD-17, H1 del informe QA del 2026-10-22): cada control de la grilla lleva
    un nombre accesible propio (`aria-label`) con el rótulo verbatim de su columna y el número de
    fila. El <th scope="col"> nombra la columna, pero no el control: sin este atributo axe-core
    reportaba 140 violaciones `label` de impacto `critical` en el estado de edición.
    El nombre accesible se indexa ("<rótulo> fila <n>", n desde 1) porque el JS renumera las filas
    al quitar una: `static/js/vigencias.js` reindexa el `aria-label` junto con `name` e `id`.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="atp-seccion" th:fragment="vigencias" aria-labelledby="titulo-level1">
  <h3 class="atp-panel__titulo" id="titulo-level1">Level1</h3>

  <div class="atp-grilla-scroll">
    <table class="atp-table" data-tabla-vigencias="true">
      <thead>
        <tr>
          <th scope="col" class="atp-th-derivado"
              title="Rótulo derivado del nombre del atributo: la KB no declara descripción">ProdFchVig</th>
          <th scope="col">Importe Fijo Entrada</th>
          <th scope="col">Imp.Cosech.Mec Entrada</th>
          <th scope="col">Importe Fijo Salida</th>
          <th scope="col">Imp.Cosech.Mec Salida</th>
          <th scope="col"><span class="atp-oculto">Acciones de la fila</span></th>
        </tr>
      </thead>
      <tbody>
        <tr data-vigencia="true" th:each="v, it : ${producto.vigencias}">
          <td>
            <input class="atp-field__control" type="date"
                   th:attr="name=|vigencias[${it.index}].prodFchVig|,id=|vigencias_${it.index}_prodFchVig|,aria-label=|ProdFchVig fila ${it.count}|"
                   th:value="${v.prodFchVig}">
            <span class="atp-celda__fecha" th:text="${v.prodFchVigTexto}">01/01/2026</span>
            <p class="atp-field__error"
               th:if="${#fields.hasErrors('vigencias[' + it.index + '].prodFchVig')}"
               th:text="${#strings.listJoin(#fields.errors('vigencias[' + it.index + '].prodFchVig'), ', ')}">Error</p>
          </td>
          <td>
            <input class="atp-field__control" type="number" step="0.01"
                   th:attr="name=|vigencias[${it.index}].prodImpu1|,id=|vigencias_${it.index}_prodImpu1|,aria-label=|Importe Fijo Entrada fila ${it.count}|"
                   th:value="${v.prodImpu1}">
            <p class="atp-field__error"
               th:if="${#fields.hasErrors('vigencias[' + it.index + '].prodImpu1')}"
               th:text="${#strings.listJoin(#fields.errors('vigencias[' + it.index + '].prodImpu1'), ', ')}">Error</p>
          </td>
          <td>
            <input class="atp-field__control" type="number" step="0.01"
                   th:attr="name=|vigencias[${it.index}].prodImpu2|,id=|vigencias_${it.index}_prodImpu2|,aria-label=|Imp.Cosech.Mec Entrada fila ${it.count}|"
                   th:value="${v.prodImpu2}">
            <p class="atp-field__error"
               th:if="${#fields.hasErrors('vigencias[' + it.index + '].prodImpu2')}"
               th:text="${#strings.listJoin(#fields.errors('vigencias[' + it.index + '].prodImpu2'), ', ')}">Error</p>
          </td>
          <td>
            <input class="atp-field__control" type="number" step="0.01"
                   th:attr="name=|vigencias[${it.index}].prodImpu3|,id=|vigencias_${it.index}_prodImpu3|,aria-label=|Importe Fijo Salida fila ${it.count}|"
                   th:value="${v.prodImpu3}">
            <p class="atp-field__error"
               th:if="${#fields.hasErrors('vigencias[' + it.index + '].prodImpu3')}"
               th:text="${#strings.listJoin(#fields.errors('vigencias[' + it.index + '].prodImpu3'), ', ')}">Error</p>
          </td>
          <td>
            <input class="atp-field__control" type="number" step="0.01"
                   th:attr="name=|vigencias[${it.index}].prodImpu4|,id=|vigencias_${it.index}_prodImpu4|,aria-label=|Imp.Cosech.Mec Salida fila ${it.count}|"
                   th:value="${v.prodImpu4}">
            <p class="atp-field__error"
               th:if="${#fields.hasErrors('vigencias[' + it.index + '].prodImpu4')}"
               th:text="${#strings.listJoin(#fields.errors('vigencias[' + it.index + '].prodImpu4'), ', ')}">Error</p>
          </td>
          <td>
            <button class="atp-btn atp-btn--ghost js-quitar-vigencia" type="button">- Fila</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="atp-botonera">
    <button class="atp-btn atp-btn--ghost" type="button" data-agregar-vigencia="true">+ Fila</button>
  </div>

  <!-- Fila-plantilla: el JS clona este contenido y sustituye __INDEX__ por el indice nuevo
       (0-based, para name/id) y __FILA__ por el numero de fila (1-based, para el aria-label). -->
  <template id="plantilla-vigencia">
    <tr data-vigencia="true">
      <td>
        <input class="atp-field__control" type="date" name="vigencias[__INDEX__].prodFchVig"
               id="vigencias___INDEX___prodFchVig" aria-label="ProdFchVig fila __FILA__">
      </td>
      <td>
        <input class="atp-field__control" type="number" step="0.01" name="vigencias[__INDEX__].prodImpu1"
               id="vigencias___INDEX___prodImpu1" aria-label="Importe Fijo Entrada fila __FILA__">
      </td>
      <td>
        <input class="atp-field__control" type="number" step="0.01" name="vigencias[__INDEX__].prodImpu2"
               id="vigencias___INDEX___prodImpu2" aria-label="Imp.Cosech.Mec Entrada fila __FILA__">
      </td>
      <td>
        <input class="atp-field__control" type="number" step="0.01" name="vigencias[__INDEX__].prodImpu3"
               id="vigencias___INDEX___prodImpu3" aria-label="Importe Fijo Salida fila __FILA__">
      </td>
      <td>
        <input class="atp-field__control" type="number" step="0.01" name="vigencias[__INDEX__].prodImpu4"
               id="vigencias___INDEX___prodImpu4" aria-label="Imp.Cosech.Mec Salida fila __FILA__">
      </td>
      <td>
        <button class="atp-btn atp-btn--ghost js-quitar-vigencia" type="button">- Fila</button>
      </td>
    </tr>
  </template>
</section>
</body>
</html>
