name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Unit Tests
        run: ./mvnw -B clean test

