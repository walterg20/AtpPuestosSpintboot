<!DOCTYPE html>
<!--
  Pantalla de Inicio (Inicio WebPanel del legacy) - T-UI-C3, R-UI-006.

  Muestra el texto descriptivo del sistema (verbatim, incluida la falta de espacio antes de
  "Otra") y la navegacion activa. Usa el layout base-stitch.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base-stitch :: head('Inicio')}">
  <title>Inicio</title>
</head>
<body class="stitch-body">
  <a class="atp-saltar" href="#contenido">Ir al contenido</a>

  <div th:replace="~{layout/base-stitch :: topbar}"></div>

  <header th:replace="~{layout/base-stitch :: hero}"></header>

  <div th:replace="~{layout/base-stitch :: sesion}"></div>

  <div th:replace="~{layout/base-stitch :: navegacion}"></div>

  <main id="contenido" class="stitch-main stitch-bg-grid">
    <h1 class="atp-pagina__titulo">Inicio</h1>

    <section class="atp-panel" aria-labelledby="titulo-inicio">
      <h2 class="atp-panel__titulo" id="titulo-inicio">Sistema de Control de Puestos Camineros y Receptor?as</h2>
      <p class="atp-inicio" th:text="${textoInicio}">Texto de inicio</p>
    </section>
  </main>

  <footer th:replace="~{layout/base-stitch :: footer-institucional}"></footer>
</body>
</html>
