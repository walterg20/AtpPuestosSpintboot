<!DOCTYPE html>
<!--
  Pantalla de Inicio (Inicio WebPanel del legacy) — T-UI-C3, R-UI-006.

  Muestra el texto descriptivo del sistema (verbatim, incluida la falta de espacio antes de
  "Otra") y el menú de navegación activo. Usa el layout base.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Inicio')}">
  <title>Inicio</title>
</head>
<body class="atp-body">
  <a class="atp-saltar" href="#contenido">Ir al contenido</a>

  <header class="atp-cabecera" th:replace="~{layout/base :: cabecera}"></header>

  <div th:replace="~{layout/base :: sesion}"></div>

  <div th:replace="~{layout/base :: navegacion}"></div>

  <main id="contenido" class="atp-pagina">
    <h1 class="atp-pagina__titulo">Inicio</h1>

    <section class="atp-panel" aria-labelledby="titulo-inicio">
      <h2 class="atp-panel__titulo" id="titulo-inicio">Sistema de Control de Puestos Camineros y Receptorías</h2>
      <p class="atp-inicio" th:text="${textoInicio}">Texto de inicio</p>
    </section>
  </main>

  <footer class="atp-pie" th:replace="~{layout/base :: pie}"></footer>
</body>
</html>
